name: CI

on:
  pull_request:
    branches: [main]
    # A protected path is allowed through by a label a human adds, and the default types
    # (opened, synchronize, reopened) do not include that. Without `labeled` the approval
    # arrived after the only run that could have read it, and the gate stayed red with no
    # way left to turn it green. `unlabeled` is the same door in reverse: withdrawing the
    # approval has to bring the gate back.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# The allowlist gate lets a protected path through when a human has labelled the pull
# request. `pull-requests: write` would let this workflow add that label itself, which is
# the approval approving itself — read-only is what keeps the label a human's act.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Audit every dependency graph in the repository
        run: .github/scripts/npm-audit-all.sh
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint --if-present
      # version-sync alone only reconciles cli-contract.yaml with package.json. The CLI's
      # embedded contract and cli-reference.md are generated from that file and nothing
      # regenerated them, so `micro-contracts extract` shipped 0.18.11 out of a 0.18.15
      # package while this step reported the versions in sync.
      - name: Verify the contract and everything generated from it match the package version
        run: npm run contract:check
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:ci
      - name: Docs in sync
        run: npm run docs:check
      - name: Verify package contents
        run: npm pack --dry-run

  # The example project is what the README tells a reader to copy, and its own guardrail check is
  # the eight gates this package exists to provide. Nothing ran it: `examples/` was outside every
  # job here, so the example shipped code that failed its own code-typecheck gate (#108) — the
  # gate was working, it had simply never been executed.
  #
  # The setup is explicit rather than leaning on npm lifecycle: eslint-plugin is a `file:`
  # dependency with no `prepare` script, so `npm ci` in examples/ symlinks it without ever
  # building dist/, and eslint.config.mjs then fails to resolve it. server/ and frontend/ carry
  # their own lockfiles, and code-typecheck needs their types.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Two gates read history. spec-breaking diffs the bundled spec against `main`, and its
          # own `|| echo "No base spec found"` would turn a missing ref into a pass. The
          # allowlist diffs the pull request against its base branch, because a checkout has
          # nothing uncommitted and asking it what changed locally inspects no file at all.
          # A shallow checkout carries neither ref.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install and build the CLI the example invokes
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm run build
      - name: Build the eslint plugin the example lints with
        working-directory: eslint-plugin
        run: |
          npm ci
          npm run build
      - name: Install the example and its two services
        run: |
          npm ci --prefix examples
          npm ci --prefix examples/server
          npm ci --prefix examples/frontend
      - name: Guardrail check
        working-directory: examples
        run: npm run check
