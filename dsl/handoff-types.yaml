openapi-audit-request:
  version: 1
  description: Request to execute an OpenAPI design review task
  schema:
    type: object
    properties:
      task_id:
        type: string
        description: Identifier of the task to execute
      context:
        type: string
        description: Built context string from OpenAPI specs, config, overlays, lint results, and deps graph
    required:
      - task_id
      - context

openapi-audit-result:
  version: 1
  description: >-
    Result of an OpenAPI design audit task.
    Schema mirrors cli-contract.yaml#/components/schemas/OpenApiAuditResult.
  schema:
    type: object
    properties:
      summary:
        type: string
      riskLevel:
        type: string
        enum: [low, medium, high, critical]
      findings:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            severity:
              type: string
              enum: [info, warning, error, critical]
            category:
              type: string
            target:
              type: string
            location:
              type: string
            message:
              type: string
            recommendation:
              type: string
            confidence:
              type: number
              minimum: 0
              maximum: 1
            evidence:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum: [file, command, schema, diff, stdout, stderr, text]
                  target:
                    type: string
                  location:
                    type: string
                  excerpt:
                    type: string
            details:
              type: object
              additionalProperties: true
          required: [severity, category, message]
      recommendedActions:
        type: array
        items:
          type: object
          properties:
            kind:
              type: string
              enum: [run_command, edit_file, review, confirm, block, ignore]
            title:
              type: string
            command:
              type: string
            target:
              type: string
            rationale:
              type: string
          required: [kind, title]
      metadata:
        type: object
        properties:
          tool:
            type: string
          command:
            type: string
          version:
            type: string
          generatedAt:
            type: string
          adapter:
            type: string
          model:
            type: string
    required:
      - summary
      - riskLevel
      - findings

published-review-result:
  version: 1
  description: >-
    Result of published API review task.
    Schema mirrors cli-contract.yaml#/components/schemas/PublishedReviewResult.
  schema:
    type: object
    properties:
      summary:
        type: string
      riskLevel:
        type: string
        enum: [low, medium, high, critical]
      findings:
        type: array
        items:
          type: object
          properties:
            severity:
              type: string
              enum: [info, warning, error, critical]
            category:
              type: string
            message:
              type: string
            recommendation:
              type: string
          required: [severity, category, message]
      publishedEndpoints:
        type: array
        items:
          type: object
          properties:
            operationId:
              type: string
            path:
              type: string
            method:
              type: string
          required: [operationId, path, method]
      leakedInternalTypes:
        type: array
        items:
          type: object
          properties:
            schemaName:
              type: string
            referencedBy:
              type: string
            reason:
              type: string
          required: [schemaName, referencedBy, reason]
      recommendedActions:
        type: array
        items:
          type: object
          properties:
            kind:
              type: string
              enum: [run_command, edit_file, review, confirm, block, ignore]
            title:
              type: string
            command:
              type: string
            target:
              type: string
            rationale:
              type: string
          required: [kind, title]
      metadata:
        type: object
        properties:
          tool:
            type: string
          command:
            type: string
          version:
            type: string
          generatedAt:
            type: string
          adapter:
            type: string
          model:
            type: string
    required:
      - summary
      - riskLevel
      - findings
      - publishedEndpoints
      - leakedInternalTypes

overlay-proposal-result:
  version: 1
  description: >-
    Result of overlay proposal task.
    Schema mirrors cli-contract.yaml#/components/schemas/OverlayProposalResult.
  schema:
    type: object
    properties:
      summary:
        type: string
      riskLevel:
        type: string
        enum: [low, medium, high, critical]
      findings:
        type: array
        items:
          type: object
          properties:
            severity:
              type: string
              enum: [info, warning, error, critical]
            category:
              type: string
            message:
              type: string
            recommendation:
              type: string
          required: [severity, category, message]
      overlayCandidates:
        type: array
        items:
          type: object
          properties:
            endpoint:
              type: string
            overlayType:
              type: string
              enum: [auth, tenancy, rateLimit, auditLog, custom]
            rationale:
              type: string
            suggestedConfig:
              type: object
              additionalProperties: true
          required: [endpoint, overlayType, rationale]
      recommendedActions:
        type: array
        items:
          type: object
          properties:
            kind:
              type: string
              enum: [run_command, edit_file, review, confirm, block, ignore]
            title:
              type: string
            command:
              type: string
            target:
              type: string
            rationale:
              type: string
          required: [kind, title]
      metadata:
        type: object
        properties:
          tool:
            type: string
          command:
            type: string
          version:
            type: string
          generatedAt:
            type: string
          adapter:
            type: string
          model:
            type: string
    required:
      - summary
      - riskLevel
      - findings
      - overlayCandidates

